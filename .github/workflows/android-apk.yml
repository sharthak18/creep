name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      # Temporary: build the verification branch on every push so compile
      # errors surface immediately without publishing a release tag.
      - "arena/**"
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3 still requests Google's removed legacy "tools" SDK package and dies with
      # "Failed to find package 'tools'". v4 installs platform-tools instead.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee /tmp/gradle-build.log

      # The Actions log download host is unreachable from the development
      # sandbox, so publish the compiler output somewhere readable in-band.
      - name: Post Gradle diagnostics to the temporary issue on failure
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Build failed on \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '### Errors'
            echo '```text'
            grep -E '(^| )(e|w): |error:|What went wrong|FAILURE: Build failed|> Task .* FAILED' /tmp/gradle-build.log | head -120 || true
            echo '```'
            echo
            echo '<details><summary>Build log tail</summary>'
            echo
            echo '```text'
            tail -c 30000 /tmp/gradle-build.log
            echo '```'
            echo '</details>'
          } > /tmp/diagnostics.md
          gh issue comment 4 --body-file /tmp/diagnostics.md

      - name: Name APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenKit.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenKit.apk
          path: ScreenKit.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ScreenKit ${{ github.ref_name }}
          generate_release_notes: true
          files: ScreenKit.apk
