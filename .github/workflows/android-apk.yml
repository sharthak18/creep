name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3 still requests Google's removed legacy "tools" SDK package and dies with
      # "Failed to find package 'tools'". v4 installs platform-tools instead.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenKit.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenKit.apk
          path: ScreenKit.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ScreenKit ${{ github.ref_name }}
          generate_release_notes: true
          files: ScreenKit.apk
