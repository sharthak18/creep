name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3 still requests Google's removed legacy "tools" SDK package and dies with
      # "Failed to find package 'tools'". v4 installs platform-tools instead.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build_apk
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Post build log to diagnostics issue
        if: failure() && steps.build_apk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Failing run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -n 250 build.log
            echo '```'
          } > build-tail.md
          gh issue comment 4 --repo "${{ github.repository }}" --body-file build-tail.md

      - name: Name APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenKit.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenKit.apk
          path: ScreenKit.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ScreenKit ${{ github.ref_name }}
          generate_release_notes: true
          files: ScreenKit.apk
